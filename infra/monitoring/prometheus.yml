alerting: #Отправка сообщений
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093 #имя сервиса и порт


rule_files:
  - /etc/prometheus/alert.rules.yml

global:
    scrape_interval: 15s #Как часто проверять метрики
scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
        - node-exporter:9100
        - prometheus:9090
  - job_name: node-exporter notebook
    static_configs:
      - targets:
        - 10.81.6.252:9100
  - job_name: node-exporter myvm
    static_configs:
      - targets:
        - 10.81.6.179:9100

